version: '3.9'

services:
  db:
    image: mariadb:11.4
    command:
      - --innodb-buffer-pool-size=512M
      - --max-connections=100
      - --slow-query-log=1
      - --long-query-time=2
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gary_portfolio
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: password
    volumes:
      - /opt/docker-stacks/gary-portfolio/db_data:/var/lib/mysql
      - /opt/docker-stacks/gary-portfolio/certs:/etc/mysql/certs:ro
    networks:
      - zone_internal
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 0
      resources:
        limits:
          cpus: '2'
          memory: 1G
      placement:
        constraints:
          - node.hostname == ubuntu-server

  wordpress:
    image: gary-portfolio-local:latest
    user: "2000:2000"
    command: php-fpm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORDPRESS_DB_HOST: databases_mariadb
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_DB_NAME: gary_portfolio
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'databases_redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_DATABASE', 2);
        define('WP_CACHE', true);
        define('WP_MAX_MEMORY_LIMIT', '1024M');
    volumes:
      - /opt/docker-stacks/gary-portfolio/html:/var/www/html
      - /opt/docker-stacks/gary-portfolio/certs/ca-cert.pem:/usr/local/share/ca-certificates/ca.crt:ro
      - /srv/media/copyright:/var/www/html/wp-content/uploads/galleries:ro
      - /opt/docker-stacks/gary-portfolio/uploads.ini:/usr/local/etc/php/conf.d/zzz-uploads.ini:ro
    networks:
      - zone_dmz
      - zone_internal
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '4'
          memory: 2G
      placement:
        constraints:
          - node.hostname == ubuntu-server

  web:
    image: nginx:alpine
    volumes:
      - /opt/docker-stacks/gary-portfolio/html:/var/www/html:ro
      - /opt/docker-stacks/gary-portfolio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - zone_dmz
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ubuntu-server

networks:
  zone_dmz:
    external: true
  zone_internal:
    external: true
