server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # Serve static files directly, pass everything else to WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP scripts to your optimized FPM container
    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
